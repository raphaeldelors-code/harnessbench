# harnessbench backend — dependency injection seam.
#
# Option A (default): `docker compose up llamaswap` spins up a containerised
#   llama-swap + engine on port 8080.
# Option B: point the runner at an existing endpoint:
#   export HB_BACKEND_URL=http://your-host:8080 HB_MODEL=your-model
#   (skip `docker compose up` entirely)
#
# Either way the bench container receives HB_CONTAINER_BACKEND_URL, which must
# be reachable *from inside* the bench container (host.docker.internal, not
# 127.0.0.1, when the backend runs on the host).
#
# Two Compose gotchas this file depends on:
#   * `-f docker/docker-compose.yml` makes `docker/` the project dir — build
#     contexts, relative volume paths and the implicit env file all resolve
#     there. The repo-root `.env` therefore has to be passed explicitly:
#     `docker compose --env-file .env -f docker/docker-compose.yml …`
#   * `~` is not expanded by Compose, so the host paths below are required
#     (absolute) rather than defaulted to a home-relative guess.

services:
  llamaswap:
    build:
      context: .
      dockerfile: Dockerfile.llamaswap
      args:
        BASE_IMAGE: ghcr.io/ggml-org/llama.cpp:server-cuda
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      # relative paths resolve against the project dir (docker/) — prefer an absolute HB_MODEL_DIR
      - ${HB_MODEL_DIR:-./models}:/models:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      HB_MODEL: ${HB_MODEL:-strata_iq3s}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/v1/models || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  bench:
    image: python:3.12-slim
    profiles: ["bench"]
    depends_on:
      llamaswap:
        condition: service_healthy
    volumes:
      - ..:/app
      - ${HB_RUNTIME_DIR:?set HB_RUNTIME_DIR to the absolute host path of the portable runtime built by scripts/setup_hb.sh}:/opt/hb:ro
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /app
    environment:
      HB_BACKEND_URL: http://llamaswap:8080
      HB_CONTAINER_BACKEND_URL: http://host.docker.internal:8080
      HB_MODEL: ${HB_MODEL:-strata_iq3s}
      # must be writable: bench/config.py puts out/, work/ and repos/ under HB_HOME
      # (the portable runtime is the read-only /opt/hb mount, read from HB_RUNTIME_DIR)
      HB_HOME: /app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["bash", "-c", "pip install -e . && hb report"]
